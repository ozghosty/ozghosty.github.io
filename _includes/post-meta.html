{%- assign words = include.post.content | strip_html | number_of_words -%}
{%- assign minutes = words | divided_by: 200 | at_least: 1 -%}
<div class="meta">
  <span>{% include icon.html name="calendar" %}<time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time></span>
  <span>{% include icon.html name="clock" %}{{ minutes }} min read</span>
</div>
